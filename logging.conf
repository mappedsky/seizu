version: 1

# gunicorn configures python logging *after* its own logger have been
# created. Disabling existing loggers (the default) will overwrite (ie delete)
# gunicorn loggers. access and errors logs will no longer work.
disable_existing_loggers: false

root:
  level: INFO
  handlers:
    - console_stdout

loggers:
  gunicorn.error:
    # Don't log debug messages given that it pollutes the log with useless
    # "Closing Connection" messages when the root logger level is set to
    # DEBUG (eg in development).
    level: INFO
    # Not propagated, or every line is emitted twice: once to console_stderr
    # here and again to root's console_stdout. Gunicorn sets propagate=False on
    # this logger itself before applying this file, so leaving it True here
    # actively re-enabled the duplication.
    propagate: False
    handlers:
    - console_stderr
  # Handlers are listed explicitly rather than left to propagation, and this is
  # load-bearing under the ASGI worker. The worker copies this logger's handlers
  # onto `uvicorn.access` and sets propagate=False on that copy, and uvicorn
  # emits an access line only when `uvicorn.access.hasHandlers()` holds. A
  # handler-less logger that reached root's console_stdout by propagation
  # therefore became a logger with no handlers and no propagation, and every
  # HTTP request went unlogged with nothing to say why. Covered by
  # tests/unit/reporting/access_log_test.py.
  gunicorn.access:
    level: INFO
    propagate: False
    handlers:
    - console_stdout
  # The access log, written by reporting.access_log.AccessLogMiddleware. Named
  # handlers rather than propagation, like the rest of this file, so request
  # logging can be quieted on its own by raising this level.
  reporting.access:
    level: INFO
    propagate: False
    handlers:
    - console_stdout
  # reduce logging noise from various libraries
  requests.packages.urllib3.connectionpool:
    level: WARN
    propagate: True
  urllib3.connectionpool:
    level: WARN
    propagate: True

filters:
  # Puts the request id on every record produced while serving a request, not
  # just the access line -- which is the reason the id comes from
  # asgi_correlation_id rather than from the access middleware itself.
  # Attached to the handlers, not to individual loggers, so it applies to
  # whatever reaches a stream, including records from libraries.
  correlation_id:
    (): asgi_correlation_id.CorrelationIdFilter
    # CorrelationIdMiddleware generates uuid4().hex, so keep all 32 characters;
    # a truncated id does not survive being grepped for across services.
    uuid_length: 32
    default_value: '-'

handlers:
  console_stdout:
    class: logging.StreamHandler
    formatter: json
    filters:
    - correlation_id
    stream: 'ext://sys.stdout'
  console_stderr:
    class: logging.StreamHandler
    formatter: json
    filters:
    - correlation_id
    stream: 'ext://sys.stderr'
  # Access logs go to console_stdout above. This file handler is left commented
  # out so it is not instantiated; add it to gunicorn.access handlers to also
  # write them to disk.
  #
  #  access_file:
  #    class: logging.FileHandler
  #    filename: '/var/log/omnibot-web-access.log'

formatters:
  json:
    class: pythonjsonlogger.json.JsonFormatter
    format: 'ts=%(asctime)s name=%(name)s lvlname=%(levelname)s correlation_id=%(correlation_id)s msg=%(message)s'
