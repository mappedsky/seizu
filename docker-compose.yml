networks:
  database:
  stats:
  proxy:
  auth:
  credentials:
    driver: bridge
    ipam:
      config:
        - subnet: "169.254.169.0/24"
          gateway: "169.254.169.1"
volumes:
  authentik_postgres_data:
  authentik_media:
  neo4j_data:
  postgres_data:
services:
  telegraf:
    image: telegraf
    volumes:
      - ./.compose/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf
    environment:
      - METRICS_PREFIX=seizu
    networks:
      stats:
  # ── OTLP trace sink (opt-in: `docker compose --profile tracing up -d`) ──
  # A turn spans the web service and several worker activities, so its spans are
  # only one tree if something collects them (AGT-026). This writes them to
  # .compose/otel/spans.jsonl rather than to a UI, which is what makes a run's
  # step and model-call spans aggregatable. Set
  # TELEMETRY_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces to export here.
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    profiles:
      - tracing
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./.config/dev/otel/collector.yaml:/etc/otel/collector.yaml:ro
      - ./.compose/otel:/traces
    networks:
      # Reachable from both sides of a turn: `seizu` admits it on proxy, the
      # worker runs it on stats.
      stats:
      proxy:
  # ── PostgreSQL (application records + independently named chat database) ──
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seizu
      POSTGRES_USER: seizu
      POSTGRES_PASSWORD: seizu
    volumes:
      # Postgres 18+ stores cluster data under a major-version-specific
      # subdirectory below /var/lib/postgresql. Mount the parent directory so
      # the image can manage that layout.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seizu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      database:
  postgres-create-chat-checkpoint-db:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${SQL_DATABASE_USER:-seizu}
      PGPASSWORD: ${SQL_DATABASE_PASSWORD:-seizu}
      CHAT_CHECKPOINT_DATABASE_URL: ${CHAT_CHECKPOINT_DATABASE_URL:-postgresql://postgres:5432/seizu-chat-checkpoints}
      CHAT_CHECKPOINT_DATABASE_USER: ${CHAT_CHECKPOINT_DATABASE_USER:-seizu}
    command:
      - sh
      - -ec
      - |
        database_url="$${CHAT_CHECKPOINT_DATABASE_URL%%\?*}"
        database="$${database_url##*/}"
        psql --dbname=postgres \
          --set=checkpoint_database="$$database" \
          --set=checkpoint_owner="$${CHAT_CHECKPOINT_DATABASE_USER}" <<'SQL'
        SELECT format(
          'CREATE DATABASE %I OWNER %I',
          :'checkpoint_database',
          :'checkpoint_owner'
        )
        WHERE NOT EXISTS (
          SELECT FROM pg_database WHERE datname = :'checkpoint_database'
        )
        \gexec
        SQL
    networks:
      database:
  # ─────────────────────────────────────────────────────────────────────────
  sqs:
    image: softwaremill/elasticmq
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9324"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./.compose/elasticmq/.elasticmq.conf:/opt/elasticmq.conf
    networks:
      database:
  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    volumes:
      - ./.compose/neo4j/neo4j.conf:/conf/neo4j.conf
      - neo4j_data:/data
      - ./.compose/neo4j/import:/import
      - ./.compose/neo4j/logs:/logs
      - ./.compose/neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=none
      # Raise memory limits (Neo4j 5.x config key names)
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      # APOC plugin — set via `make apoc_enable`. Empty = disabled (default).
      - NEO4J_PLUGINS=${NEO4J_PLUGINS:-}
      # Keep local file reads disabled even if a LOAD CSV validator bypass is found.
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=false
      # APOC is optional in dev; when enabled, load only known-safe utility
      # namespaces and do not grant unrestricted procedure/function access.
      - NEO4J_dbms_security_procedures_allowlist=apoc.convert.*,apoc.text.*
      # Use a non-empty minimal value; the Neo4j Docker APOC helper replaces
      # an empty unrestricted setting with its broad apoc.* default.
      - NEO4J_dbms_security_procedures_unrestricted=apoc.convert.*,apoc.text.*
      # Defense in depth for Cypher SSRF: Seizu rejects LOAD CSV/APOC network
      # queries, and Neo4j should also block Cypher-originated HTTP/FTP access.
      - NEO4J_internal_dbms_cypher__ip__blocklist=0.0.0.0/0,::/0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      database:
  # ── Authentik identity provider ──────────────────────────────────────────
  # Use `make auth_enable && make down && make up` to start with auth.
  # make up includes --profile auth automatically when DEVELOPMENT_ONLY_REQUIRE_AUTH=true.
  # Setup is fully automated — no browser wizard required.
  #   Admin:     akadmin / devpassword  (http://localhost:9000)
  #   Dev user:  developer / devpassword
  # The seizu OIDC application is created automatically via the blueprint.
  authentik-postgresql:
    image: postgres:18-alpine
    profiles:
      - auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
    volumes:
      # Match the Postgres 18+ volume layout used by the official image.
      - authentik_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      auth:
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2.3
    profiles:
      - auth
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      # Use a fixed dev secret — change this in production
      AUTHENTIK_SECRET_KEY: seizu-dev-secret-change-in-production
      # Bootstrap the initial admin account on first run
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@localhost
      AUTHENTIK_BOOTSTRAP_PASSWORD: devpassword
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # There is no server-side setting for the advertised URL or the issuer:
      # OAuth2Provider.get_issuer() calls request.build_absolute_uri(), so both
      # the `iss` claim and every endpoint in the discovery document come from
      # the request's Host header, and `issuer_mode` only picks the path.
      # (AUTHENTIK_HOST_BROWSER, which used to be set here, is an *outpost*
      # variable and does nothing on the server container.) Everything therefore
      # has to reach Authentik as localhost:9000 — see authentik-loopback below.
    volumes:
      - authentik_media:/data
      - ./.config/dev/authentik/blueprints:/blueprints/custom:ro
    ports:
      - "9000:9000"
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/lifecycle/ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Allow time for DB migrations and built-in blueprint application on first run
      start_period: 90s
    networks:
      auth:
      proxy:
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2.3
    profiles:
      - auth
    restart: unless-stopped
    command: worker
    user: root
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: seizu-dev-secret-change-in-production
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/data
      - ./.config/dev/authentik/blueprints:/blueprints/custom:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      authentik-postgresql:
        condition: service_healthy
    networks:
      auth:
  temporal:
    # Temporal CLI image running the lightweight dev server (in-memory SQLite):
    # gRPC frontend on :7233, Web UI on :8233.
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - 7233:7233
      - 8233:8233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      database:
  # Lightweight external MCP OAuth proxy plus the official GitHub MCP server
  # for local integration testing. `make external_mcp_enable` also enables the
  # local Authentik profile: proxy users authenticate through the same IDP and
  # SSO session as Seizu.
  # Optional: exercises Seizu's OAuth-challenge handling (RFC 9728 discovery and
  # 401 recovery) against a proxy that really requires it. Not part of the
  # default profile — it authenticates the *caller to the proxy* and contributes
  # no GitHub authority, so requiring it for ordinary local use bought a
  # short-lived token that expires mid-run for no gain. Start it explicitly:
  #   docker compose --profile external-mcp --profile external-mcp-oauth up
  external-mcp-proxy:
    build:
      context: .
      dockerfile: .config/dev/external-mcp-proxy/Dockerfile
    profiles:
      - external-mcp-oauth
    depends_on:
      - external-mcp-github-auth
    environment:
      - OAUTH_CLIENT_ID=${DEV_MCP_PROXY_OAUTH_CLIENT_ID:-seizu-external-mcp-proxy}
      - OAUTH_CLIENT_SECRET=${DEV_MCP_PROXY_OAUTH_CLIENT_SECRET:-seizu-external-mcp-proxy-dev-secret}
      - OAUTH_AUTHORIZE_URL=${DEV_MCP_PROXY_OAUTH_AUTHORIZE_URL:-http://localhost:9000/application/o/seizu-external-mcp-proxy}
      - SCOPES_SUPPORTED=${DEV_MCP_PROXY_SCOPES:-openid,email,profile}
      - MCP_SERVER_URL=${DEV_MCP_PROXY_UPSTREAM_URL:-http://external-mcp-github-auth:8080}
      - ENCRYPTION_KEY=${DEV_MCP_PROXY_ENCRYPTION_KEY:-}
      - HOST=0.0.0.0
      # Authentik derives its issuer and discovery endpoints from the request
      # host. The wrapper's supervised loopback forwarder keeps this identical
      # to the browser-facing localhost:9000 authority (AUTH-002).
      - DEV_OIDC_LOOPBACK_TARGET=authentik-server:9000
    ports:
      - 8081:8080
    networks:
      database:
      auth:
  # Obot owns the inbound Authorization header. This internal-only adapter
  # supplies the separate development PAT expected by GitHub's HTTP MCP server.
  external-mcp-github-auth:
    image: caddy:2-alpine
    profiles:
      - external-mcp
    depends_on:
      - external-mcp-github
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${DEV_GITHUB_MCP_TOKEN:-}
    volumes:
      - .config/dev/github-mcp/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      database:
  # deps.dev package metadata, reached the way every other third party is: an
  # external MCP proxy, so the egress is here rather than in the Seizu backend.
  # Prototype -- runs the Seizu image because it already carries the MCP SDK.
  external-mcp-deps:
    image: ghcr.io/mappedsky/seizu
    user: seizu
    working_dir: /home/seizu/seizu
    command: ["python", "-m", "scripts.deps_dev_mcp"]
    profiles:
      - external-mcp
    volumes:
      - .:/home/seizu/seizu
    environment:
      - PORT=8080
      - DEPS_DEV_API
      - DEPS_DEV_TIMEOUT_SECONDS
      - DEPS_DEV_MAX_NODES
    networks:
      database:
  external-mcp-github:
    image: ghcr.io/github/github-mcp-server:latest
    command: ["http"]
    profiles:
      - external-mcp
    environment:
      - GITHUB_READ_ONLY=${DEV_GITHUB_MCP_READ_ONLY:-1}
      - GITHUB_TOOLSETS=${DEV_GITHUB_MCP_TOOLSETS:-default}
    networks:
      database:
  seizu-temporal-worker:
    image: ghcr.io/mappedsky/seizu
    restart: on-failure
    user: seizu
    depends_on:
      temporal:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-create-chat-checkpoint-db:
        condition: service_completed_successfully
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE
      - TEMPORAL_TASK_QUEUE
      - TEMPORAL_WORKER_ENABLED
      - TEMPORAL_CHAT_ACTIVITY_TIMEOUT_SECONDS
      - TEMPORAL_ENABLED_WORKFLOWS
      - WORKFLOW_QUERY_MAX_ROWS
      - WORKFLOW_WATCH_POLL_SECONDS
      - WORKFLOW_RECONCILE_SECONDS
      - WORKFLOW_ACTIVITY_MODULES=reporting.scheduled_query_modules.sqs,reporting.scheduled_query_modules.slack,reporting.scheduled_query_modules.log,reporting.scheduled_query_modules.statsd
      - "SQS_CREATE_SCHEDULED_QUERY_QUEUES=true"
      - SQS_URL=http://sqs:9324
      - SLACK_OAUTH_BOT_TOKEN
      - STATSD_HOST=telegraf
      - STATSD_CONSTANT_TAGS
      - CARTOGRAPHY_TASK_QUEUE
      - CARTOGRAPHY_ENABLED_MODULES
      - CARTOGRAPHY_MODULE_TIMEOUT_SECONDS
      - CARTOGRAPHY_MODULE_WAIT_SECONDS
      - CARTOGRAPHY_SYNC_RETRY_ATTEMPTS
      - REMEDIATION_CI_MAX_WAIT_SECONDS
      - REMEDIATION_CI_POLL_SECONDS
      - REMEDIATION_CI_QUEUED_STUCK_SECONDS
      - REMEDIATION_CI_FIX_MAX_ATTEMPTS
      # Workflow chat sessions enforce the creator's stored role unless dev
      # mode is on; keep this aligned with the seizu service.
      - DEVELOPMENT_ONLY_REQUIRE_AUTH
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fake
      - AWS_DEFAULT_REGION=us-east-1
      - SQL_DATABASE_URL=${SQL_DATABASE_URL:-postgresql://postgres:5432/seizu}
      - SQL_DATABASE_USER=${SQL_DATABASE_USER:-seizu}
      - SQL_DATABASE_PASSWORD=${SQL_DATABASE_PASSWORD:-seizu}
      # Chat LLM + checkpointer — the worker drives headless chat sessions, so
      # it needs the same chat configuration as the seizu service.
      - CHAT_LLM_PROVIDER
      - CHAT_LLM_MODEL
      - CHAT_LLM_API_KEY
      - CHAT_LLM_BASE_URL
      - CHAT_LLM_TEMPERATURE
      - CHAT_LLM_MAX_TOKENS
      - CHAT_LLM_TIMEOUT_SECONDS
      - CHAT_LLM_MAX_RETRIES
      - CHAT_LLM_CONTEXT_MAX_MESSAGES
      - CHAT_LLM_CONTEXT_MAX_TOKENS
      - CHAT_LLM_CONTEXT_WINDOW_SHARE
      - CHAT_LLM_CONTEXT_WINDOW_TOKENS
      - CHAT_LLM_CONTEXT_WINDOW_FALLBACK_TOKENS
      - CHAT_LLM_CONTEXT_SAFETY_MARGIN
      - CHAT_LLM_PROMPT_CACHE_ENABLED
      - CHAT_LLM_PROMPT_CACHE_MIN_TOKENS
      - CHAT_LLM_CACHE_DIAGNOSTICS
      - CHAT_LLM_HISTORY_COMPACTION
      - CHAT_LLM_HISTORY_COMPACTION_TARGET
      - CHAT_LLM_HISTORY_SUMMARY_MAX_TOKENS
      - CHAT_LLM_DISCLOSE_SKILL_TOOLS
      - CHAT_LLM_DISCLOSE_SKILL_TOOLS_MAX_TOKENS
      - CHAT_SESSION_MEMORY_MAX_ENTRIES
      - CHAT_SESSION_MEMORY_MAX_RECEIPTS
      - CHAT_SESSION_MEMORY_DIGEST_MAX_CHARS
      - SANDBOX_SESSION_PERSIST
      # Interactive turns run here, so the turn settings apply to this
      # service too -- the producer half of them.
      - CHAT_TURN_RETENTION_SECONDS
      - CHAT_TURN_STREAM_LATENCY_MS
      - CHAT_TURN_TIMEOUT_SECONDS
      - CHAT_LLM_SYSTEM_PROMPT
      - CHAT_LLM_PROGRESSIVE_DISCLOSURE
      - CHAT_LLM_MAX_AUTO_ACTIONS
      - CHAT_LLM_MAX_PARALLEL_TOOL_CALLS
      - CHAT_ORCHESTRATOR_ENABLED
      - CHAT_ORCHESTRATOR_MAX_STEPS
      - CHAT_ORCHESTRATOR_PLANNER_MAX_TOKENS
      - CHAT_ORCHESTRATOR_MAX_ITERATIONS
      - CHAT_ORCHESTRATOR_MAX_PARALLEL
      - CHAT_ORCHESTRATOR_WORKER_MAX_ACTIONS
      - CHAT_RUN_TOKEN_BUDGET
      - CHAT_RUN_COST_BUDGET_USD
      - CHAT_RUN_RESERVE_PERCENT
      - CHAT_RUN_SOFT_LIMIT_PERCENT
      - CHAT_RUN_MAX_LLM_CALLS
      - CHAT_LLM_PLANNER_MODEL
      - CHAT_LLM_WORKER_MODEL
      - CHAT_LLM_VERIFIER_MODEL
      - CHAT_LLM_SYNTHESIZER_MODEL
      - CHAT_LLM_ECONOMY_MODEL
      - TELEMETRY_ENABLED
      - TELEMETRY_OTLP_ENDPOINT
      - TELEMETRY_OTLP_HEADERS
      - TELEMETRY_SERVICE_NAME
      - TELEMETRY_RECORD_CONTENT
      - CHAT_LLM_REASONING_EFFORT
      - CHAT_LLM_ROUTER_REASONING_EFFORT
      - CHAT_LLM_PLANNER_REASONING_EFFORT
      - CHAT_LLM_WORKER_REASONING_EFFORT
      - CHAT_LLM_WORKER_SUMMARY_REASONING_EFFORT
      - CHAT_LLM_VERIFIER_REASONING_EFFORT
      - CHAT_LLM_SYNTHESIZER_REASONING_EFFORT
      - CHAT_RUN_LLM_CALLS_PER_STEP
      - CHAT_RUN_UNPRICED_LLM_CALLS_PER_STEP
      - CHAT_RUN_UNPRICED_TOKEN_BUDGET
      - CHAT_BUDGET_OUTPUT_ESTIMATE_TOKENS
      - CHAT_BUDGET_OUTPUT_ESTIMATE_SAFETY
      - CHAT_BUDGET_CONTENTION_WAIT_SECONDS
      - CHAT_ORCHESTRATOR_MAX_EXPANSION
      - CHAT_ORCHESTRATOR_MAX_PARALLEL
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - DEEPSEEK_API_KEY
      # External MCP proxy discovery and per-user/M2M delegation. The named
      # token is the convenient default used by the documentation; production
      # orchestrators may inject any token_env referenced by the JSON config.
      - MCP_EXTERNAL_ENABLED
      - MCP_EXTERNAL_PROXIES
      - MCP_EXTERNAL_CONFIRMATION_REQUIRED_TOOLS
      - MCP_EXTERNAL_RATE_LIMIT_RETRIES
      - MCP_EXTERNAL_RATE_LIMIT_MAX_WAIT_SECONDS
      - MCP_EXTERNAL_RATE_LIMIT_DEFAULT_WAIT_SECONDS
      - MCP_EXTERNAL_PROXY_TOKEN
      - CHAT_CHECKPOINT_DATABASE_URL=${CHAT_CHECKPOINT_DATABASE_URL:-postgresql://postgres:5432/seizu-chat-checkpoints}
      - CHAT_CHECKPOINT_DATABASE_USER=${CHAT_CHECKPOINT_DATABASE_USER:-seizu}
      - CHAT_CHECKPOINT_DATABASE_PASSWORD=${CHAT_CHECKPOINT_DATABASE_PASSWORD:-seizu}
      - CHAT_CHECKPOINT_DATABASE_POOL_MIN_SIZE
      - CHAT_CHECKPOINT_DATABASE_POOL_MAX_SIZE
      - CHAT_CHECKPOINT_CREATE_TABLE=true
      # Sandbox delegation — workflow chat sessions run here and may call the
      # sandbox__delegate tool.
      - SANDBOX_ENABLED
      - SANDBOX_API_KEY
      - SANDBOX_DOMAIN
      - SANDBOX_ALLOW_INTERNET
      - SANDBOX_TIMEOUT_SECONDS
      - SANDBOX_SESSION_TIMEOUT_SECONDS
      - SANDBOX_MAX_OUTPUT_BYTES
      - SANDBOX_DIRECT_TOOLS_ENABLED
      - SANDBOX_LLM_MODEL
      # Chat feature flags. The worker reads these for scheduled-chat schedule
      # reconciliation; without them it treats chat as disabled and reconciles
      # nothing, however the web service is configured.
      - CHAT_ENABLED
      - CHAT_SCHEDULES_ENABLED
      # Session reaping — the sweep runs here (and only here), so these have to
      # reach this service or the settings a deployment sets have no effect.
      - SEIZU_DEPLOYMENT_ID
      - CHAT_SESSION_REAP_ENABLED
      - CHAT_SESSION_REAP_IDLE_SECONDS
      - CHAT_SESSION_REAP_INTERVAL_SECONDS
      - SANDBOX_REAP_UNTAGGED
      # CVE dependency remediation — the cve_dependency_remediation activity
      # drives the sandbox directly from this worker; the coding agent phase
      # never sees REMEDIATION_GITHUB_TOKEN. Configured = enabled.
      - SANDBOX_AGENT_PROVIDER
      - SANDBOX_AGENT_TEMPLATE
      - SANDBOX_AGENT_API_KEY
      - SANDBOX_AGENT_API_KEY_COMMAND
      - SANDBOX_AGENT_BASE_URL
      - SANDBOX_AGENT_MODEL
      - SANDBOX_AGENT_CREDENTIAL_PROXY_ENABLED
      - SANDBOX_AGENT_CREDENTIAL_PROXY_MAX_BUDGET
      - SANDBOX_AGENT_CREDENTIAL_PROXY_REQUIREMENTS_FILE
      - SANDBOX_AGENT_CREDENTIAL_PROXY_TEMPLATE
      - REMEDIATION_TIMEOUT_SECONDS
      - REMEDIATION_GH_VERSION
      - REMEDIATION_GH_SHA256
      - REMEDIATION_GITHUB_HOST
      - REMEDIATION_GITHUB_TOKEN
      - REMEDIATION_USE_FORK
      - REMEDIATION_FORK_ORG
      - REMEDIATION_GIT_USER
      - REMEDIATION_GIT_EMAIL
    command: python -m reporting.temporal_worker
    volumes:
      - .:/home/seizu/seizu
    networks:
      stats:
      database:
  seizu:
    image: ghcr.io/mappedsky/seizu
    build:
      context: .
      target: dev
    user: seizu
    depends_on:
      # Interactive chat admission starts a Temporal workflow. Waiting for the
      # frontend here prevents the web service becoming healthy while chat's
      # required runtime is still starting. The worker may start concurrently:
      # Temporal durably queues workflows until it begins polling.
      temporal:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-create-chat-checkpoint-db:
        condition: service_completed_successfully
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_NOTIFICATIONS_MIN_SEVERITY=OFF
      # JWT authentication is disabled for development by default.
      # To enable Authentik auth, start with --profile auth and change to:
      #   DEVELOPMENT_ONLY_REQUIRE_AUTH=true
      - DEVELOPMENT_ONLY_REQUIRE_AUTH
      - DEVELOPMENT_ONLY_AUTH_USER_EMAIL=testuser
      # Generic JWKS settings — works with any standard OIDC provider.
      # When using Authentik (--profile auth), this resolves through the
      # loopback forwarder below, like every other OIDC URL here.
      #
      # Every IDP-specific value here is overridable from .env, so pointing dev
      # at a different provider does not need a compose override file. Doing so
      # means setting DEV_OIDC_LOOPBACK_TARGET= as well (see below) — the
      # defaults below and the forwarder only make sense together.
      - JWKS_URL=${JWKS_URL-http://localhost:9000/application/o/seizu/jwks/}
      - JWT_HEADER_NAME=${JWT_HEADER_NAME-Authorization}
      - JWT_EMAIL_CLAIM=${JWT_EMAIL_CLAIM-email}
      - JWT_AUDIENCE=${JWT_AUDIENCE-seizu}
      # Pass-throughs: unset here so reporting/settings.py supplies the default
      # (some of which are derived -- the revocation and introspection auth
      # methods default to the token-endpoint one). A compose substitution with
      # an empty fallback would defeat that, because str_env returns a
      # set-but-empty variable rather than its default.
      - JWT_ISSUER
      - JWT_USERNAME_CLAIM
      - ALLOWED_JWT_ALGORITHMS
      # OIDC client config served to the frontend via GET /api/v1/config.
      # The redirect_uri must be the publicly reachable callback URL in the browser.
      # One authority for everyone -- browser, MCP client, CLI and the backend's
      # own token exchange all reach Authentik as localhost:9000, so it stamps a
      # single issuer and one login is one Seizu user. OIDC_INTERNAL_AUTHORITY is
      # deliberately unset: reaching the IDP under a second hostname is what
      # forks (iss, sub) into two identities. See AUTH-001 in
      # docs/root/dev/decisions/authentication.md.
      - OIDC_AUTHORITY=${OIDC_AUTHORITY-http://localhost:9000/application/o/seizu}
      # What makes localhost:9000 resolvable in here: scripts/dev_oidc_loopback.py,
      # started and supervised by scripts/dev_entrypoint.sh (this service's
      # command) and forwarding the container's loopback to the IDP. It runs in
      # this container rather than as a sidecar because a sidecar sharing this
      # network namespace survives `up --force-recreate seizu` still reporting
      # healthy while attached to the dead namespace; the entrypoint supervises
      # both processes so a dead forwarder takes the container down instead of
      # breaking auth quietly. See AUTH-002.
      #
      # The entrypoint starts it only when DEVELOPMENT_ONLY_REQUIRE_AUTH is on,
      # so the default unauthenticated stack neither runs nor depends on it.
      # To use an IDP other than the compose Authentik, set this empty in .env
      # *and* override OIDC_AUTHORITY / JWKS_URL / OIDC_CLIENT_ID there: the
      # defaults above all point at localhost:9000, which only exists because
      # this forwarder creates it. Never set in the production image.
      - DEV_OIDC_LOOPBACK_TARGET=${DEV_OIDC_LOOPBACK_TARGET-authentik-server:9000}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID-seizu}
      # Everything a non-Authentik provider may need, passed through so the
      # settings defaults survive when unset. The dev client is public (PKCE,
      # no secret), which is why none of these are set here: a confidential
      # client needs OIDC_CLIENT_SECRET *and* an auth method other than the
      # default "none", or authlib sends no client credentials at all.
      - OIDC_CLIENT_SECRET
      - OIDC_TOKEN_ENDPOINT_AUTH_METHOD
      - OIDC_REVOCATION_ENDPOINT_AUTH_METHOD
      - OIDC_INTROSPECTION_ENDPOINT_AUTH_METHOD
      # For IDPs issuing opaque access tokens (Google, some Okta/Auth0 setups).
      - OIDC_ENABLE_TOKEN_INTROSPECTION
      # Provider-specific authorize knobs, e.g. Google's
      # "access_type=offline,prompt=consent".
      - OIDC_AUTHORIZE_EXTRA_PARAMS
      # Escape hatch for providers whose ID token cannot be verified server-side.
      - OIDC_VALIDATE_ID_TOKEN
      # OIDC_REDIRECT_URI intentionally unset: the backend derives the
      # callback URL from each incoming request's Host header, so the same
      # build serves users on :3000 (vite dev proxy) and :8080 (FastAPI
      # serving the prod build) without one redirect URL clobbering the other.
      # offline_access requests a refresh_token, which the BFF uses for
      # silent renewal via direct POST to the token endpoint.
      - "OIDC_SCOPE=${OIDC_SCOPE-openid email profile offline_access}"
      # Disable HTTPS redirect in development (plain HTTP)
      - "TALISMAN_FORCE_HTTPS=false"
      # AWS credentials for local integrations such as SQS.
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fakefake
      - AWS_DEFAULT_REGION=us-east-1
