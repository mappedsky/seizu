[install]
# Resolve only versions published at least a week ago (in seconds), so a
# compromised release has time to be noticed and pulled before it is installed.
# An urgent security fix newer than that is admitted with
# `minimumReleaseAgeExcludes = ["<package>"]`.
minimumReleaseAge = 604800

[test]
preload = ["./src/registerTestDom.ts", "./src/setupTests.ts"]
coverageSkipTestFiles = true
coverageThreshold = { line = 0.73, function = 0.64 }
