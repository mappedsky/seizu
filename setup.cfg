[mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_errors = false
implicit_optional = true
plugins = pydantic.mypy

# These ship no type information. Declared per module rather than through a
# global --ignore-missing-imports, so an import this list does not name has to
# resolve: a typo or a dropped dependency is an error, not silence.
[mypy-boto3.*]
ignore_missing_imports = true

[mypy-botocore.*]
ignore_missing_imports = true

[mypy-authlib.*]
ignore_missing_imports = true

[mypy-CyVer.*]
ignore_missing_imports = true

[mypy-e2b_code_interpreter.*]
ignore_missing_imports = true

[mypy-jsonschema]
ignore_missing_imports = true

[mypy-tests.*]
ignore_errors = true

[mypy-tests.unit.reporting.openapi_contract_test]
ignore_errors = false

[mypy-tests.unit.reporting.schema.ids_test]
ignore_errors = false

[mypy-docs.*]
ignore_errors = true

[tool:pytest]
asyncio_mode = auto

[coverage:report]
fail_under = 90
