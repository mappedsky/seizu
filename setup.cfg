[mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_errors = false
implicit_optional = true
plugins = pydantic.mypy

[mypy-tests.*]
ignore_errors = true

[mypy-tests.unit.reporting.openapi_contract_test]
ignore_errors = false

[mypy-tests.unit.reporting.schema.ids_test]
ignore_errors = false

[mypy-docs.*]
ignore_errors = true

[tool:pytest]
asyncio_mode = auto

[coverage:report]
fail_under = 90
