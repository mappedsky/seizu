# Pomerium Core: the local external MCP gateway. Dev-only secrets.
#
# Every dev MCP server is one route, and Seizu reaches each as a user_oauth
# proxy: a user connects once from Chat Connections and Seizu then calls with
# that user's own access token (AGT-059). Routes are host-based because
# Pomerium publishes OAuth metadata per host; *.localhost.pomerium.io resolves
# to 127.0.0.1 for the browser and to this container inside the stack.
address: :8443
authenticate_service_url: https://authenticate.localhost.pomerium.io:8443

# Generated by entrypoint.sh: Pomerium advertises its MCP OAuth endpoints as
# https:// even with insecure_server, so the gateway has to serve TLS.
certificate_file: /certs/server.pem
certificate_key_file: /certs/server-key.pem

shared_secret: 7ts8H6A/JAIderQJZviPloVciVu6UZ45072BxZPonN8=
cookie_secret: wJTxv+IFxtEaaNlWdgdm4gcGG4ZoCm6mUXVuEFvprA0=

# Reached through the in-container localhost:9000 forwarder, so the issuer is
# the one the browser sees (AUTH-002).
idp_provider: oidc
idp_provider_url: http://localhost:9000/application/o/seizu-external-mcp-gateway/
idp_client_id: seizu-external-mcp-gateway
idp_client_secret: seizu-external-mcp-gateway-dev-secret
idp_scopes: [openid, email, profile, offline_access]

# Durable, so a gateway restart keeps every user's grants. The connection
# string comes from DATABROKER_STORAGE_CONNECTION_STRING in docker-compose.yml.
databroker_storage_type: postgres

# Seizu registers itself as a confidential client. The default, client ID
# metadata documents, are fetched only from public HTTPS.
runtime_flags:
  mcp_dynamic_client_registration: true

log_level: info

# Pomerium buffers each MCP request to authorize it, and refuses one larger
# than max_request_bytes (default 4 KiB) with a 413, so every route raises it.
routes:
  - name: deps.dev
    description: Package metadata from deps.dev
    from: https://deps.localhost.pomerium.io:8443
    to: http://external-mcp-deps:8080
    mcp:
      server:
        path: /mcp
        max_request_bytes: 10485760
    policy:
      - allow:
          and:
            - authenticated_user: true

  - name: GitHub
    description: GitHub's MCP server, through the local PAT adapter
    from: https://github.localhost.pomerium.io:8443
    to: http://external-mcp-github-auth:8080
    mcp:
      server:
        path: /mcp
        max_request_bytes: 10485760
    policy:
      - allow:
          and:
            - authenticated_user: true

  - name: Elicitation tester
    description: Form and URL elicitation scenarios for manual testing
    from: https://elicit.localhost.pomerium.io:8443
    to: http://external-mcp-elicitation-tester:8080
    mcp:
      server:
        path: /mcp
        max_request_bytes: 10485760
    policy:
      - allow:
          and:
            - authenticated_user: true

  # The one route with a per-user upstream grant: Pomerium runs Authentik's
  # OAuth for each user and the upstream reports whose grant authorized a call.
  - name: whoami
    description: Reports which upstream grant authorized each call
    from: https://whoami.localhost.pomerium.io:8443
    to: http://external-mcp-whoami:8080
    mcp:
      server:
        max_request_bytes: 10485760
        upstream_oauth2:
          client_id: seizu-external-mcp-whoami
          client_secret: seizu-external-mcp-whoami-dev-secret
          scopes: [openid, email, profile, offline_access]
          endpoint:
            auth_url: http://localhost:9000/application/o/authorize/
            token_url: http://localhost:9000/application/o/token/
    policy:
      - allow:
          and:
            - authenticated_user: true
