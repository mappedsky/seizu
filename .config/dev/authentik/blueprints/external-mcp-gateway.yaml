# Authentik blueprint for the local external MCP gateway (Pomerium Core,
# .config/dev/external-mcp-gateway). Two confidential clients, kept apart from
# Seizu's own public client so the gateway cannot change Seizu's login (AUTH-004):
#
#   seizu-external-mcp-gateway  Pomerium's own sign-in (its identity provider).
#   seizu-external-mcp-whoami   The authorization server Pomerium uses on each
#                               user's behalf for the whoami route's upstream.
#
# Access tokens are short so ordinary use exercises refresh on both legs.
version: 1
metadata:
  name: Seizu local external MCP gateway
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Clients this gateway replaced: the Obot proxy's and the Pomerium spike's.
  # Applications go before the providers they reference.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: seizu-external-mcp-proxy
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: pomerium-spike
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: pomerium-spike-upstream
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: seizu-external-mcp-proxy
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: pomerium-spike
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: pomerium-spike-upstream

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: seizu-external-mcp-gateway
    attrs:
      name: seizu-external-mcp-gateway
      client_type: confidential
      client_id: seizu-external-mcp-gateway
      client_secret: seizu-external-mcp-gateway-dev-secret
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      redirect_uris:
        - url: https://authenticate.localhost.pomerium.io:8443/oauth2/callback
          matching_mode: strict
      access_token_validity: minutes=5
      # Every route a user connects in one Pomerium sign-in carries a copy of
      # this refresh token, so it must not be replaced on each use: the default
      # threshold (seconds=0) revokes it at the first route's refresh and strands
      # the others. Renewed only in its last week (AGT-060).
      refresh_token_validity: days=365
      refresh_token_threshold: days=7
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, "authentik Self-signed Certificate"]
      include_claims_in_id_token: true
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-openid"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-email"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-profile"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: seizu-external-mcp-gateway
    attrs:
      name: Seizu external MCP gateway
      slug: seizu-external-mcp-gateway
      provider: !Find
        - authentik_providers_oauth2.oauth2provider
        - [name, seizu-external-mcp-gateway]
      policy_engine_mode: any

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: seizu-external-mcp-whoami
    attrs:
      name: seizu-external-mcp-whoami
      client_type: confidential
      client_id: seizu-external-mcp-whoami
      client_secret: seizu-external-mcp-whoami-dev-secret
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      # Pomerium's upstream callback lives on the route's own host.
      redirect_uris:
        - url: 'https://whoami\.localhost\.pomerium\.io(:8443)?/\.pomerium/mcp/client/oauth/callback'
          matching_mode: regex
      access_token_validity: minutes=2
      refresh_token_validity: days=30
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, "authentik Self-signed Certificate"]
      include_claims_in_id_token: true
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-openid"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-email"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-profile"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: seizu-external-mcp-whoami
    attrs:
      name: Seizu whoami MCP upstream
      slug: seizu-external-mcp-whoami
      provider: !Find
        - authentik_providers_oauth2.oauth2provider
        - [name, seizu-external-mcp-whoami]
      policy_engine_mode: any
