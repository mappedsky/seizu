# Authentik blueprint: configures a public OAuth2/OIDC provider for Seizu
# development. Applied automatically on worker startup via the blueprint
# directory mount.
#
# The provider uses the Authorization Code flow with PKCE (public client)
# for browser-based SPAs, and the Device Authorization Grant (RFC 8628) for
# the CLI (seizu_cli/commands/auth.py → seizu login).
version: 1
metadata:
  name: Seizu Development OIDC Provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Dev users — idempotent: safe to re-apply on every startup
  - model: authentik_core.user
    state: present
    identifiers:
      username: akadmin
    attrs:
      password: devpassword

  - model: authentik_core.user
    state: present
    identifiers:
      username: developer
    attrs:
      name: Developer
      email: developer@localhost
      is_active: true
      password: devpassword

  # Seizu RBAC groups — one per built-in role
  - model: authentik_core.group
    state: present
    identifiers:
      name: seizu-admin
    attrs:
      name: seizu-admin

  - model: authentik_core.group
    state: present
    identifiers:
      name: seizu-editor
    attrs:
      name: seizu-editor

  - model: authentik_core.group
    state: present
    identifiers:
      name: seizu-viewer
    attrs:
      name: seizu-viewer

  # Seizu dev users — one per built-in role; password: seizu
  - model: authentik_core.user
    state: present
    identifiers:
      username: seizu-admin
    attrs:
      name: Seizu Admin
      email: seizu-admin@localhost
      is_active: true
      password: seizu
      groups:
        - !Find [authentik_core.group, [name, seizu-admin]]

  - model: authentik_core.user
    state: present
    identifiers:
      username: seizu-editor
    attrs:
      name: Seizu Editor
      email: seizu-editor@localhost
      is_active: true
      password: seizu
      groups:
        - !Find [authentik_core.group, [name, seizu-editor]]

  - model: authentik_core.user
    state: present
    identifiers:
      username: seizu-viewer
    attrs:
      name: Seizu Viewer
      email: seizu-viewer@localhost
      is_active: true
      password: seizu
      groups:
        - !Find [authentik_core.group, [name, seizu-viewer]]

  # Custom scope mapping: embeds seizu_role claim based on group membership.
  # Seizu reads this via RBAC_ROLE_CLAIM (default: seizu_role) to resolve permissions
  # without any database lookups.
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      managed: seizu.dev/providers/oauth2/scope-seizu-role
    attrs:
      name: Seizu Role
      scope_name: openid
      expression: |
        group_role_map = {
            "seizu-admin": "seizu-admin",
            "seizu-editor": "seizu-editor",
            "seizu-viewer": "seizu-viewer",
        }
        for group in request.user.groups.all():
            if group.name in group_role_map:
                return {"seizu_role": group_role_map[group.name]}
        return {"seizu_role": "seizu-viewer"}

  # OAuth2/OIDC provider — supports two grant types:
  #   1. Authorization Code + PKCE  (browser SPA, frontend)
  #   2. Device Authorization Grant (CLI, seizu login)
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: seizu
    attrs:
      name: seizu
      # Public client: no client secret; uses PKCE for browser flows and
      # device_code for CLI flows.
      client_type: public
      client_id: seizu
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      # BFF auth callback — both the bun dev server (which proxies /api to
      # the backend, preserving Host) and the FastAPI backend directly.
      # The :8888/callback entry is for the CLI's device-code post-auth
      # browser landing page.
      redirect_uris:
        - url: http://localhost:3000/api/v1/auth/callback
          matching_mode: strict
        - url: http://localhost:8080/api/v1/auth/callback
          matching_mode: strict
        - url: http://localhost:8888/callback
          matching_mode: strict
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, "authentik Self-signed Certificate"]
      # Include standard claims in the ID token so the frontend can read them
      include_claims_in_id_token: true
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-openid"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-email"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-profile"]
        # offline_access issues a refresh_token, used by the BFF for silent
        # renewal via the token endpoint.
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "seizu.dev/providers/oauth2/scope-seizu-role"]

  # Application that binds the provider to a slug
  - model: authentik_core.application
    state: present
    identifiers:
      slug: seizu
    attrs:
      name: Seizu
      slug: seizu
      provider: !Find
        - authentik_providers_oauth2.oauth2provider
        - [name, seizu]
      policy_engine_mode: any

  # Confidential client for the local external MCP proxy. It is intentionally
  # a separate OAuth client from Seizu's public PKCE/device client, while using
  # the same Authentik users and browser SSO session.
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: seizu-external-mcp-proxy
    attrs:
      name: seizu-external-mcp-proxy
      client_type: confidential
      client_id: seizu-external-mcp-proxy
      client_secret: seizu-external-mcp-proxy-dev-secret
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      redirect_uris:
        - url: http://localhost:8081/callback
          matching_mode: strict
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, "authentik Self-signed Certificate"]
      include_claims_in_id_token: true
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-openid"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-email"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-profile"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: seizu-external-mcp-proxy
    attrs:
      name: Seizu External MCP Proxy
      slug: seizu-external-mcp-proxy
      provider: !Find
        - authentik_providers_oauth2.oauth2provider
        - [name, seizu-external-mcp-proxy]
      policy_engine_mode: any

  # Brand: apply Seizu theme to the default-domain login page
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: "localhost:9000"
    attrs:
      domain: "localhost:9000"
      branding_title: Seizu
      # Required for the Device Authorization Grant: Authentik checks
      # brand.flow_device_code before processing /device?code=... requests.
      # The implicit-consent flow is used as the entry flow; when the code
      # is pre-filled in the URL, Authentik skips this flow and routes
      # directly through the provider's authorization_flow.
      flow_device_code: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      branding_custom_css: |
        /* ── Seizu theme for Authentik ───────────────────────────────────────
           Matches the Material-UI palette used by the Seizu React frontend.
           Primary: #5664d2  |  Dark bg: #121212 / #1e1e1e
        ──────────────────────────────────────────────────────────────────── */

        :root {
          --ak-accent: #5664d2;
          --ak-dark-foreground: rgba(255, 255, 255, 0.87);
          --ak-dark-foreground-link: #7986e7;
          --ak-dark-background: #121212;
          --ak-dark-background-light: #1e1e1e;
          --ak-dark-background-lighter: #2c2c2c;
          --ak-dark-background-button: #5664d2;
          --ak-dark-background-button-active: #3d4fc9;
        }

        /* Force dark mode regardless of system preference */
        :root,
        .pf-t-dark {
          color-scheme: dark;
        }

        body {
          background-color: var(--ak-dark-background) !important;
          color: var(--ak-dark-foreground) !important;
        }

        /* Login card */
        .pf-c-login,
        .ak-login-container {
          background-color: var(--ak-dark-background) !important;
        }

        .pf-c-login__main,
        .pf-c-card,
        ak-flow-executor {
          background-color: var(--ak-dark-background-light) !important;
          border: 1px solid rgba(255, 255, 255, 0.12) !important;
          border-radius: 4px !important;
        }

        /* Form labels */
        .pf-c-form__label,
        .pf-c-title,
        label {
          color: var(--ak-dark-foreground) !important;
        }

        /* Inputs */
        .pf-c-form-control,
        input[type="text"],
        input[type="email"],
        input[type="password"] {
          background-color: var(--ak-dark-background-lighter) !important;
          color: var(--ak-dark-foreground) !important;
          border-color: rgba(255, 255, 255, 0.23) !important;
        }

        .pf-c-form-control:focus,
        input:focus {
          border-color: var(--ak-accent) !important;
          box-shadow: 0 0 0 1px var(--ak-accent) !important;
        }

        /* Primary button */
        .pf-c-button.pf-m-primary,
        button[type="submit"],
        .pf-c-login__main-footer-links-item button {
          background-color: var(--ak-accent) !important;
          border-color: var(--ak-accent) !important;
          color: #ffffff !important;
        }

        .pf-c-button.pf-m-primary:hover,
        button[type="submit"]:hover {
          background-color: var(--ak-dark-background-button-active) !important;
          border-color: var(--ak-dark-background-button-active) !important;
        }

        /* Links */
        a {
          color: var(--ak-dark-foreground-link) !important;
        }
