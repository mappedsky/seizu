# Authentik blueprint for the Pomerium delegated-OAuth spike
# (.config/dev/pomerium-spike/README.md). Two confidential clients, kept apart
# from Seizu's own so the spike cannot change Seizu's login:
#
#   pomerium-spike           Pomerium's own sign-in (its IdP).
#   pomerium-spike-upstream  The authorization server Pomerium uses on behalf
#                            of each user for the whoami upstream.
#
# Access tokens are short so a single sitting exercises refresh on both legs.
version: 1
metadata:
  name: Seizu Pomerium spike
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: pomerium-spike
    attrs:
      name: pomerium-spike
      client_type: confidential
      client_id: pomerium-spike
      client_secret: pomerium-spike-dev-secret
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      redirect_uris:
        - url: https://authenticate.localhost.pomerium.io:8443/oauth2/callback
          matching_mode: strict
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, "authentik Self-signed Certificate"]
      include_claims_in_id_token: true
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-openid"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-email"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-profile"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: pomerium-spike
    attrs:
      name: Pomerium spike
      slug: pomerium-spike
      provider: !Find
        - authentik_providers_oauth2.oauth2provider
        - [name, pomerium-spike]
      policy_engine_mode: any

  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: pomerium-spike-upstream
    attrs:
      name: pomerium-spike-upstream
      client_type: confidential
      client_id: pomerium-spike-upstream
      client_secret: pomerium-spike-upstream-dev-secret
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-explicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      # Pomerium's upstream callback lives on each MCP route's own host.
      redirect_uris:
        - url: 'https://whoami-[ab]\.localhost\.pomerium\.io(:8443)?/\.pomerium/mcp/client/oauth/callback'
          matching_mode: regex
      access_token_validity: minutes=2
      refresh_token_validity: days=30
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, "authentik Self-signed Certificate"]
      include_claims_in_id_token: true
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-openid"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-email"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-profile"]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, "goauthentik.io/providers/oauth2/scope-offline_access"]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: pomerium-spike-upstream
    attrs:
      name: Pomerium spike upstream
      slug: pomerium-spike-upstream
      provider: !Find
        - authentik_providers_oauth2.oauth2provider
        - [name, pomerium-spike-upstream]
      policy_engine_mode: any
